name: Release

# Runs when scripts/release.sh pushes a tag. It tests the tag, builds wm.app signed with the project certificate and creates the
# GitHub release with the app attached. The same certificate signs every release, so macOS keeps the Accessibility and Screen
# Recording grants through `brew upgrade wm` (see scripts/make-signing-cert.sh for the secrets).
# scripts/release.sh then points the Homebrew tap (g4rcez/homebrew-tap) at the asset: no token here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Version.swift
        run: |
          declared="$(sed -n 's/.*wmVersion = "\(.*\)".*/\1/p' Sources/Common/Version.swift)"
          [ "v$declared" = "$GITHUB_REF_NAME" ] || { echo "Version.swift says $declared, the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Test
        run: swift test
      - name: Import the signing certificate
        env:
          WM_SIGNING_P12: ${{ secrets.WM_SIGNING_P12 }}
          WM_SIGNING_P12_PASSWORD: ${{ secrets.WM_SIGNING_P12_PASSWORD }}
        run: |
          [ -n "$WM_SIGNING_P12" ] || { echo "the secret WM_SIGNING_P12 is empty: run scripts/make-signing-cert.sh"; exit 1; }
          keychain="$RUNNER_TEMP/wm-signing.keychain-db"
          password="$(uuidgen)"
          echo "$WM_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/wm-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/wm-signing.p12" -k "$keychain" -P "$WM_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/wm-signing.p12"
          identity="$(security find-identity -p codesigning "$keychain" | awk '/wm release signing/ { print $2; exit }')"
          [ -n "$identity" ] || { echo "no signing identity in the certificate"; exit 1; }
          echo "WM_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "WM_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build the app
        # A universal binary: the package supports Intel Macs too.
        run: CODESIGN_IDENTITY="$WM_IDENTITY" NO_START=1 NO_STOP=1 SWIFT_BUILD_FLAGS="--arch arm64 --arch x86_64" ./build-app.sh release
      - name: The signature must not depend on the build
        run: |
          requirement="$(codesign -dr - .build/wm.app 2>&1 | grep 'designated =>')"
          echo "$requirement"
          case "$requirement" in *cdhash*) echo "the app is signed ad hoc: the permissions would reset on every upgrade"; exit 1 ;; esac
          codesign --verify --deep --strict .build/wm.app
          lipo -archs .build/wm.app/Contents/MacOS/wmd
      - name: Pack the app
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="wm-$version-macos.tar.gz"
          mkdir pack && ditto .build/wm.app pack/wm.app && cp LICENSE pack/
          tar -C pack -czf "$archive" wm.app LICENSE
          shasum -a 256 "$archive" | cut -d' ' -f1 > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --title "wm ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
      - name: Remove the signing keychain
        if: always()
        run: |
          [ -z "${WM_KEYCHAIN:-}" ] || security delete-keychain "$WM_KEYCHAIN" || true
