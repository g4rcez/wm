name: Release

# Runs when scripts/release.sh pushes a tag. It tests the tag and creates the GitHub release.
# The Homebrew tap (g4rcez/homebrew-tap) follows the latest release by itself: no token here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Version.swift
        run: |
          declared="$(sed -n 's/.*wmVersion = "\(.*\)".*/\1/p' Sources/Common/Version.swift)"
          [ "v$declared" = "$GITHUB_REF_NAME" ] || { echo "Version.swift says $declared, the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Test
        run: swift test
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "wm ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
