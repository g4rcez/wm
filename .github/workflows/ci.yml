name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch or pull request makes its older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    # wm needs the Swift 6.2 toolchain (Xcode 26): Package.swift fails with a clear message on an older one.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, for `make version-check`.
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: swift-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      - name: Version
        run: make version-check
      - name: Build
        run: swift build
      - name: Test
        # A hung test must fail the step, not wait for the job limit.
        timeout-minutes: 10
        run: swift test
      - name: Release build
        # The release builds with optimizations: code that only breaks there shows up here, not on the release Mac.
        run: swift build -c release

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
