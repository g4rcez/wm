<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>wm icon: a window with nine blocks, three lit on a diagonal</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303250"/>
      <stop offset="1" stop-color="#13131c"/>
    </linearGradient>
    <radialGradient id="bgtop" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#9db8ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9db8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tilerim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#383a56"/>
      <stop offset="1" stop-color="#1f2031"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d8ff"/>
      <stop offset="0.35" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#4a66a8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3d58"/>
      <stop offset="1" stop-color="#2d2f45"/>
    </linearGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dimedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.11"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7da"/>
      <stop offset="0.5" stop-color="#ffe6a8"/>
      <stop offset="1" stop-color="#f8c96c"/>
    </linearGradient>
    <linearGradient id="litshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#c98a1c" stop-opacity="0"/>
      <stop offset="1" stop-color="#c98a1c" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd884" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffd884" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileclip"><rect width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="windowclip"><rect x="136" y="180" width="752" height="664" rx="68"/></clipPath>
    <filter id="halo" x="-60%" y="-70%" width="220%" height="240%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="bloom" x="-120%" y="-140%" width="340%" height="380%"><feGaussianBlur stdDeviation="78"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- The tile -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#bgtop)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="227" fill="none" stroke="url(#tilerim)" stroke-width="6"/>

  <!-- The window, scaled 1.15 around the middle of the tile: 56 from the border at the sides. -->
  <g clip-path="url(#tileclip)">
  <g transform="translate(512 512) scale(1.15) translate(-512 -512)">
    <rect x="132" y="206" width="760" height="672" rx="72" fill="#000" opacity="0.6" filter="url(#shadow)"/>
    <rect x="132" y="176" width="760" height="672" rx="72" fill="url(#frame)"/>
    <g clip-path="url(#windowclip)">
      <rect x="136" y="180" width="752" height="112" fill="url(#titlebar)"/>
      <rect x="136" y="180" width="752" height="664" fill="url(#sheen)"/>
    </g>
    <rect x="136" y="180" width="752" height="664" rx="68" fill="none" stroke="url(#rim)" stroke-width="8"/>

    <!-- Light that the lamps throw on the window -->
  <circle cx="744" cy="398" r="240" fill="url(#spill)"/>
  <circle cx="512" cy="566" r="240" fill="url(#spill)"/>
  <circle cx="280" cy="734" r="240" fill="url(#spill)"/>

    <!-- Title bar -->
    <!-- Close, minimize, zoom: flat dots in the colors of a macOS window -->
    <g>
      <circle cx="214" cy="236" r="19" fill="#ff5f57"/>
      <circle cx="270" cy="236" r="19" fill="#febc2e"/>
      <circle cx="326" cy="236" r="19" fill="#28c840"/>
    </g>
    <line x1="168" y1="292" x2="856" y2="292" stroke="#000000" stroke-opacity="0.28" stroke-width="3"/>
    <line x1="168" y1="295" x2="856" y2="295" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

    <!-- Nine blocks, 3 x 3: 200 x 136, 32 between them. Three are lit, on a diagonal. -->
    <g fill="#ffcf70" opacity="0.5" filter="url(#bloom)">
    <rect x="644" y="330" width="200" height="136"/>
    <rect x="412" y="498" width="200" height="136"/>
    <rect x="180" y="666" width="200" height="136"/>
    </g>
    <g fill="#ffd07a" opacity="0.9" filter="url(#halo)">
    <rect x="644" y="330" width="200" height="136"/>
    <rect x="412" y="498" width="200" height="136"/>
    <rect x="180" y="666" width="200" height="136"/>
    </g>
    <g>
    <rect x="180" y="330" width="200" height="136" rx="28" fill="url(#dim)"/>
    <rect x="180" y="330" width="200" height="136" rx="28" fill="url(#recess)"/>
    <rect x="181.5" y="331.5" width="197" height="133" rx="26.5" fill="none" stroke="url(#dimedge)" stroke-width="3"/>
    <rect x="412" y="330" width="200" height="136" rx="28" fill="url(#dim)"/>
    <rect x="412" y="330" width="200" height="136" rx="28" fill="url(#recess)"/>
    <rect x="413.5" y="331.5" width="197" height="133" rx="26.5" fill="none" stroke="url(#dimedge)" stroke-width="3"/>
    <rect x="644" y="330" width="200" height="136" rx="28" fill="url(#lit)"/>
    <rect x="644" y="330" width="200" height="136" rx="28" fill="url(#litshade)"/>
    <rect x="652" y="337" width="184" height="63" rx="21" fill="url(#gloss)"/>
    <rect x="645.5" y="331.5" width="197" height="133" rx="26.5" fill="none" stroke="#fffaf0" stroke-opacity="0.9" stroke-width="3"/>
    <rect x="180" y="498" width="200" height="136" rx="28" fill="url(#dim)"/>
    <rect x="180" y="498" width="200" height="136" rx="28" fill="url(#recess)"/>
    <rect x="181.5" y="499.5" width="197" height="133" rx="26.5" fill="none" stroke="url(#dimedge)" stroke-width="3"/>
    <rect x="412" y="498" width="200" height="136" rx="28" fill="url(#lit)"/>
    <rect x="412" y="498" width="200" height="136" rx="28" fill="url(#litshade)"/>
    <rect x="420" y="505" width="184" height="63" rx="21" fill="url(#gloss)"/>
    <rect x="413.5" y="499.5" width="197" height="133" rx="26.5" fill="none" stroke="#fffaf0" stroke-opacity="0.9" stroke-width="3"/>
    <rect x="644" y="498" width="200" height="136" rx="28" fill="url(#dim)"/>
    <rect x="644" y="498" width="200" height="136" rx="28" fill="url(#recess)"/>
    <rect x="645.5" y="499.5" width="197" height="133" rx="26.5" fill="none" stroke="url(#dimedge)" stroke-width="3"/>
    <rect x="180" y="666" width="200" height="136" rx="28" fill="url(#lit)"/>
    <rect x="180" y="666" width="200" height="136" rx="28" fill="url(#litshade)"/>
    <rect x="188" y="673" width="184" height="63" rx="21" fill="url(#gloss)"/>
    <rect x="181.5" y="667.5" width="197" height="133" rx="26.5" fill="none" stroke="#fffaf0" stroke-opacity="0.9" stroke-width="3"/>
    <rect x="412" y="666" width="200" height="136" rx="28" fill="url(#dim)"/>
    <rect x="412" y="666" width="200" height="136" rx="28" fill="url(#recess)"/>
    <rect x="413.5" y="667.5" width="197" height="133" rx="26.5" fill="none" stroke="url(#dimedge)" stroke-width="3"/>
    <rect x="644" y="666" width="200" height="136" rx="28" fill="url(#dim)"/>
    <rect x="644" y="666" width="200" height="136" rx="28" fill="url(#recess)"/>
    <rect x="645.5" y="667.5" width="197" height="133" rx="26.5" fill="none" stroke="url(#dimedge)" stroke-width="3"/>
    </g>
  </g>
  </g>
</svg>
